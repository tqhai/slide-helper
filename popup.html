<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><style>
body{width:330px;font:14px system-ui;padding:12px}button{padding:10px;cursor:pointer;margin-top:12px}input{width:85px;padding:6px}label{display:block;margin:8px 0}#status{white-space:pre-wrap;line-height:1.5}
</style></head><body>
<p>Tua đến cuối mỗi slide, chờ ngẫu nhiên rồi bấm TIẾP THEO.</p>
<label>Chờ tối thiểu (giây): <input id="min" type="number" min="1" max="3600" step="0.1" value="3"></label>
<label>Chờ tối đa (giây): <input id="max" type="number" min="1" max="3600" step="0.1" value="7"></label>
<button id="start">Bắt đầu tự chạy</button> <button id="stop" disabled>Dừng</button>
<p id="status">Đang kiểm tra tab…</p>
<p>Có thể đóng popup khi đang chạy. Mở lại để xem trạng thái hoặc dừng. Tải lại tab sẽ dừng.</p>
<script src="popup.js"></script></body></html>
